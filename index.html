<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%SITE_TITLE%</title>
    <meta
      name="description"
      content="Vikas Rangaswamy — software engineer at Contentstack in Bangalore, building automation, AI connectors, and agentic systems, plus enterprise integrations and SaaS marketplace apps."
    />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta
      property="og:description"
      content="Building automation, AI connectors & agentic systems at Contentstack — plus enterprise integrations and SaaS apps. React, Node.js, TypeScript, Python, AWS."
    />
    <meta property="og:type" content="profile" />
    <meta property="profile:first_name" content="Vikas" />
    <meta property="profile:last_name" content="Rangaswamy" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SITE_TITLE%" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta
      name="twitter:description"
      content="Building automation, AI connectors & agentic systems at Contentstack — plus enterprise integrations and SaaS apps. React, Node.js, TypeScript, Python, AWS."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- JSON-LD graph: Person + WebSite + ProfilePage. Helps Google answer
         name searches with a knowledge-panel-style hit and gives AI answerers a
         single, machine-readable identity. `dateModified` is stamped at build
         (via the portfolio-seo plugin) so it always reads as recently updated. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "%SITE_URL%/#person",
            "name": "Vikas Rangaswamy",
            "givenName": "Vikas",
            "familyName": "Rangaswamy",
            "url": "%SITE_URL%/",
            "jobTitle": "Software Engineer",
            "worksFor": {
              "@type": "Organization",
              "name": "Contentstack",
              "url": "https://www.contentstack.com/"
            },
            "alumniOf": {
              "@type": "CollegeOrUniversity",
              "name": "JSS Science and Technology University"
            },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Bangalore",
              "addressRegion": "Karnataka",
              "addressCountry": "IN"
            },
            "image": "%SITE_URL%/profile.jpg",
            "knowsAbout": [
              "Automation",
              "AI connectors",
              "Agentic systems",
              "LLM integrations",
              "Full-stack web development",
              "React",
              "Node.js",
              "TypeScript",
              "Python",
              "AWS",
              "Headless CMS",
              "SaaS integrations"
            ],
            "sameAs": [
              "https://github.com/vikasrangaswamy",
              "https://www.linkedin.com/in/vikasrangaswamy/",
              "https://www.instagram.com/vikas_rangaswamy/"
            ],
            "description": "Software engineer at Contentstack building automation, AI connectors, and agentic systems, plus enterprise integrations and SaaS marketplace apps."
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Vikas Rangaswamy",
            "inLanguage": "en",
            "publisher": { "@id": "%SITE_URL%/#person" }
          },
          {
            "@type": "ProfilePage",
            "@id": "%SITE_URL%/#profilepage",
            "url": "%SITE_URL%/",
            "name": "%SITE_TITLE%",
            "isPartOf": { "@id": "%SITE_URL%/#website" },
            "about": { "@id": "%SITE_URL%/#person" },
            "dateModified": "%BUILD_DATE%"
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the font CSS without blocking first paint: fetch it as a
         non-blocking "print" stylesheet, then promote it to all media once it
         arrives. `display=swap` keeps text visible in the fallback font until
         the web font loads, so there's no invisible-text flash. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;430;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;430;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;430;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Prevent FOUC by setting initial theme before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Crawlable content fallback for bots that don't run JavaScript (many AI
         crawlers). React renders into #root above; this sibling stays in the
         raw HTML so there's always real text about who this is. -->
    <noscript>
      <h1>Vikas Rangaswamy</h1>
      <p>
        Software Engineer at Contentstack, Bangalore, India. Vikas Rangaswamy builds
        automation, AI connectors, and agentic systems, plus enterprise integrations and
        SaaS marketplace apps — with React, Node.js, TypeScript, Python, and AWS.
      </p>
      <p>
        Links:
        <a href="%SITE_URL%/about">About</a>,
        <a href="%SITE_URL%/experience">Experience</a>,
        <a href="%SITE_URL%/projects">Projects</a>,
        <a href="%SITE_URL%/stats">Stats</a>,
        <a href="https://github.com/vikasrangaswamy">GitHub</a>,
        <a href="https://www.linkedin.com/in/vikasrangaswamy/">LinkedIn</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cloudflare Web Analytics — manual snippet (required: Cloudflare Pages
         does NOT auto-inject the beacon). Token is for the vikasrangaswamy.com
         site. The beacon posts to cloudflareinsights.com/cdn-cgi/rum; that call
         is blocked/404'd by ad-blockers, so verify from a clean browser. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "3116358875124162aaa666a7d97df1ec"}'
    ></script>
  </body>
</html>
