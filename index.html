    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the font CSS without blocking first paint: fetch it as a
         non-blocking "print" stylesheet, then promote it to all media once it
         arrives. `display=swap` keeps text visible in the fallback font until
         the web font loads, so there's no invisible-text flash. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;430;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;430;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>

        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;430;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Prevent FOUC by setting initial theme before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
