name: Sync stats

on:
  schedule:
    - cron: '17 6 * * *' # daily ~06:17 UTC
  workflow_dispatch:

permissions:
  # Just needs to commit the refreshed JSON. Cloudflare Pages auto-builds on
  # the resulting push to main, so there's no deploy workflow to dispatch.
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch LeetCode stats
        env:
          LEETCODE_USERNAME: VIKAS_RANGASWAMY
        run: node scripts/fetch-leetcode-stats.mjs

      - name: Fetch GitHub contributions
        env:
          GITHUB_USERNAME: vikasrangaswamy
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github-contributions.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/leetcode.json public/data/github.json
            git commit -m "chore: refresh LeetCode + GitHub stats"
            git push
          else
            echo "No changes."
          fi
